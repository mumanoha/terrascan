<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TerraScan v2 — Research & Engineering Dossier</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Physics-Informed Satellite & Rover Soil Nutrient Mapping for Regeneron STS & ISEF">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- Aggressive Cache Prevention -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/style.min.css">
  <style>
    :root {
      --theme-color: #2e7d32;
    }
    .sidebar {
      font-size: 14px;
      line-height: 1.6;
    }
    .markdown-section {
      max-width: 920px;
      padding: 30px 40px;
    }
    .sidebar-nav strong {
      color: #2e7d32;
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 0.5px;
      display: block;
      margin-top: 15px;
    }
    mjx-container {
      overflow-x: auto;
      overflow-y: hidden;
      max-width: 100%;
    }
    /* --- Responsive Scrollable Tables --- */
    .table-wrapper {
      width: 100% !important;
      max-width: 100% !important;
      overflow-x: auto !important;
      -webkit-overflow-scrolling: touch;
      margin: 1.5rem 0;
      border-radius: 8px;
      border: 1px solid rgba(148, 163, 184, 0.25);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      position: relative;
    }

    .table-wrapper table {
      display: table !important;
      width: auto !important;
      min-width: 100% !important;
      margin: 0 !important;
      border-collapse: collapse;
    }

    .table-wrapper th {
      white-space: nowrap;
      font-size: 13px;
      font-weight: 600;
      padding: 10px 14px;
      text-align: left;
    }

    .table-wrapper td {
      font-size: 13px;
      line-height: 1.5;
      padding: 10px 14px;
      vertical-align: top;
    }

    /* Modern Styled Scrollbar for Tables */
    .table-wrapper::-webkit-scrollbar {
      height: 9px;
    }
    .table-wrapper::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.08);
      border-radius: 4px;
    }
    .table-wrapper::-webkit-scrollbar-thumb {
      background: #10b981;
      border-radius: 4px;
    }
    .table-wrapper::-webkit-scrollbar-thumb:hover {
      background: #059669;
    }

    /* Fallback for un-wrapped tables before JS execution */
    .markdown-section > table {
      display: block !important;
      overflow-x: auto !important;
      -webkit-overflow-scrolling: touch;
      max-width: 100%;
    }

    /* --- Interactive Lightbox & Diagram Zoom Modal --- */
    .markdown-section img,
    .mermaid {
      cursor: zoom-in !important;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .markdown-section img:hover,
    .mermaid:hover {
      box-shadow: 0 0 0 2px #10b981, 0 8px 24px rgba(0, 0, 0, 0.25);
    }
    .mermaid {
      position: relative;
    }
    .mermaid::after {
      content: "🔍 Click to expand full screen";
      position: absolute;
      bottom: 8px;
      right: 12px;
      font-size: 11px;
      font-weight: 500;
      color: #10b981;
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 3px 8px;
      border-radius: 4px;
      pointer-events: none;
      opacity: 0.85;
      transition: opacity 0.2s ease;
    }
    .mermaid:hover::after {
      opacity: 1;
      background: rgba(15, 23, 42, 0.96);
    }

    #ts-lightbox-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(10, 15, 26, 0.94);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 999999;
      flex-direction: column;
    }
    #ts-lightbox-modal.active { display: flex; }
    .ts-lightbox-bar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 20px; background: rgba(15, 23, 42, 0.95);
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      color: #f1f5f9; font-size: 14px; user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .ts-lightbox-title {
      font-weight: 600;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #e2e8f0;
      max-width: 50vw;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ts-lightbox-controls { display: flex; gap: 8px; align-items: center; }
    .ts-btn {
      background: #1e293b; color: #f8fafc; border: 1px solid #475569; border-radius: 6px;
      padding: 6px 12px; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.15s ease;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .ts-btn:hover { background: #334155; border-color: #64748b; }
    .ts-btn-theme { background: #0f766e; border-color: #14b8a6; }
    .ts-btn-theme:hover { background: #115e59; }
    .ts-btn-close { background: #be123c; border-color: #f43f5e; font-weight: 600; }
    .ts-btn-close:hover { background: #9f1239; }
    .ts-zoom-display {
      font-size: 13px; color: #94a3b8; min-width: 45px; text-align: center; font-variant-numeric: tabular-nums;
    }
    .ts-lightbox-viewport {
      flex: 1; overflow: hidden; position: relative; display: flex; align-items: center; justify-content: center;
      cursor: grab; user-select: none; padding: 30px;
    }
    .ts-lightbox-viewport.grabbing { cursor: grabbing; }
    .ts-lightbox-stage {
      position: absolute;
      transform-origin: center center;
      display: flex; align-items: center; justify-content: center;
    }
    .ts-lightbox-card {
      background: #ffffff;
      padding: 24px;
      border-radius: 10px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ts-lightbox-card.transparent-mode {
      background: transparent;
      box-shadow: none;
      padding: 0;
    }
    .ts-lightbox-card img,
    .ts-lightbox-card svg {
      max-width: 88vw;
      max-height: 78vh;
      display: block;
      object-fit: contain;
    }
    .ts-lightbox-hint {
      position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
      font-size: 12px; color: #64748b; pointer-events: none;
      background: rgba(15, 23, 42, 0.7); padding: 4px 12px; border-radius: 12px;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: '🌱 TerraScan v2',
      repo: 'https://github.com/mumanoha/terrascan',
      loadSidebar: true,
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      },
      subMaxLevel: 3,
      auto2top: true,
      homepage: 'README.md',
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search research, science, code...',
        noData: 'No results found',
        depth: 4
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied'
      },
      latex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        customOptions: {
          tex: {
            tags: 'ams'
          }
        }
      },
      plugins: [
        function(hook, vm) {
          hook.doneEach(function() {
            // Automatically wrap all markdown tables in responsive scrollable container
            document.querySelectorAll('.markdown-section table').forEach(function(table) {
              if (!table.parentElement.classList.contains('table-wrapper')) {
                var wrapper = document.createElement('div');
                wrapper.className = 'table-wrapper';
                table.parentNode.insertBefore(wrapper, table);
                wrapper.appendChild(table);
              }
            });
          });
        }
      ]
    };
  </script>

  <!-- Docsify v4 (Core must load before plugins) -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/index.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-markdown.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-latex.min.js"></script>

  <!-- LaTeX Engine & docsify-latex (must load after Docsify) -->
  <script src="//cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-latex@0"></script>

  <!-- Mermaid Diagram Support -->
  <script src="//cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-mermaid@2/dist/docsify-mermaid.js"></script>
  <script>mermaid.initialize({ startOnLoad: true, theme: 'neutral' });</script>

  <!-- Interactive Lightbox Modal -->
  <div id="ts-lightbox-modal">
    <div class="ts-lightbox-bar">
      <div class="ts-lightbox-title">
        <span id="ts-lightbox-icon">🔍</span>
        <span id="ts-lightbox-title-text">Diagram Inspector</span>
      </div>
      <div class="ts-lightbox-controls">
        <button class="ts-btn" id="ts-zoom-out" title="Zoom Out (Scroll Down)">－ Zoom</button>
        <span class="ts-zoom-display" id="ts-zoom-display">100%</span>
        <button class="ts-btn" id="ts-zoom-in" title="Zoom In (Scroll Up)">＋ Zoom</button>
        <button class="ts-btn" id="ts-zoom-reset" title="Reset Scale and Pan">Reset (1:1)</button>
        <button class="ts-btn ts-btn-theme" id="ts-card-toggle" title="Toggle Card Background">Card: White</button>
        <button class="ts-btn ts-btn-close" id="ts-close" title="Close (Esc)">✕ Close (ESC)</button>
      </div>
    </div>
    <div class="ts-lightbox-viewport" id="ts-viewport">
      <div class="ts-lightbox-stage" id="ts-stage">
        <div class="ts-lightbox-card" id="ts-card"></div>
      </div>
      <div class="ts-lightbox-hint">Scroll or pinch to zoom · Click and drag to pan · Press ESC to exit</div>
    </div>
  </div>

  <script>
    (function() {
      let currentScale = 1.0;
      let translateX = 0;
      let translateY = 0;
      let isDragging = false;
      let startX = 0, startY = 0;
      let initTransX = 0, initTransY = 0;
      let whiteCardMode = true;

      const modal = document.getElementById('ts-lightbox-modal');
      const stage = document.getElementById('ts-stage');
      const card = document.getElementById('ts-card');
      const viewport = document.getElementById('ts-viewport');
      const zoomDisplay = document.getElementById('ts-zoom-display');
      const titleText = document.getElementById('ts-lightbox-title-text');
      const cardToggle = document.getElementById('ts-card-toggle');
      const closeBtn = document.getElementById('ts-close');
      const zoomInBtn = document.getElementById('ts-zoom-in');
      const zoomOutBtn = document.getElementById('ts-zoom-out');
      const zoomResetBtn = document.getElementById('ts-zoom-reset');

      function applyTransform() {
        stage.style.transform = `translate(${translateX}px, ${translateY}px) scale(${currentScale})`;
        zoomDisplay.textContent = `${Math.round(currentScale * 100)}%`;
      }

      function getContextTitle(element) {
        // Try previous heading
        let parent = element.closest('.mermaid') || element.closest('p') || element;
        let prev = parent.previousElementSibling;
        while (prev) {
          if (/^H[1-6]$/.test(prev.tagName)) return prev.textContent.replace(/^#+\s*/, '').trim();
          prev = prev.previousElementSibling;
        }
        // Try next caption/em
        let next = parent.nextElementSibling;
        if (next && next.querySelector('em')) return next.querySelector('em').textContent.trim();
        return 'Diagram Inspector';
      }

      function openLightbox(element, title, type) {
        card.innerHTML = '';
        currentScale = 1.0;
        translateX = 0;
        translateY = 0;

        card.classList.remove('transparent-mode');
        whiteCardMode = true;
        cardToggle.textContent = 'Card: White';

        if (type === 'img') {
          const img = element.cloneNode(true);
          img.removeAttribute('width');
          img.removeAttribute('height');
          const nw = element.naturalWidth || element.clientWidth || 1000;
          const nh = element.naturalHeight || element.clientHeight || 750;
          
          const maxW = window.innerWidth * 0.88;
          const maxH = window.innerHeight * 0.78;
          const aspect = nw / nh;
          let targetW, targetH;
          if (maxW / maxH > aspect) {
            targetH = maxH;
            targetW = maxH * aspect;
          } else {
            targetW = maxW;
            targetH = maxW / aspect;
          }

          img.style.width = Math.round(targetW) + 'px';
          img.style.height = Math.round(targetH) + 'px';
          img.style.maxWidth = '88vw';
          img.style.maxHeight = '78vh';
          img.style.display = 'block';
          img.style.objectFit = 'contain';
          card.appendChild(img);
        } else {
          const clone = element.cloneNode(true);
          const vb = clone.viewBox ? clone.viewBox.baseVal : null;
          const vbW = (vb && vb.width > 0) ? vb.width : (element.clientWidth || 1000);
          const vbH = (vb && vb.height > 0) ? vb.height : (element.clientHeight || 750);
          
          const maxW = window.innerWidth * 0.88;
          const maxH = window.innerHeight * 0.78;
          const aspect = vbW / vbH;
          let targetW, targetH;
          if (maxW / maxH > aspect) {
            targetH = maxH;
            targetW = maxH * aspect;
          } else {
            targetW = maxW;
            targetH = maxW / aspect;
          }

          clone.setAttribute('width', Math.round(targetW));
          clone.setAttribute('height', Math.round(targetH));
          clone.style.width = Math.round(targetW) + 'px';
          clone.style.height = Math.round(targetH) + 'px';
          clone.style.maxWidth = '88vw';
          clone.style.maxHeight = '78vh';
          clone.style.aspectRatio = `${vbW} / ${vbH}`;
          clone.style.display = 'block';

          card.appendChild(clone);
        }

        titleText.textContent = title || 'Figure Inspector';
        applyTransform();
        modal.classList.add('active');
        document.body.style.overflow = 'hidden';
      }

      function closeLightbox() {
        modal.classList.remove('active');
        card.innerHTML = '';
        document.body.style.overflow = '';
      }

      // Drag and Pan
      viewport.addEventListener('mousedown', (e) => {
        if (e.target.closest('.ts-lightbox-bar')) return;
        isDragging = true;
        startX = e.clientX;
        startY = e.clientY;
        initTransX = translateX;
        initTransY = translateY;
        viewport.classList.add('grabbing');
      });

      window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        translateX = initTransX + (e.clientX - startX);
        translateY = initTransY + (e.clientY - startY);
        applyTransform();
      });

      window.addEventListener('mouseup', () => {
        isDragging = false;
        viewport.classList.remove('grabbing');
      });

      // Wheel and Pinch Zoom
      viewport.addEventListener('wheel', (e) => {
        e.preventDefault();
        const factor = e.deltaY < 0 ? 1.15 : 0.87;
        currentScale = Math.min(Math.max(0.15, currentScale * factor), 6.0);
        applyTransform();
      }, { passive: false });

      // Buttons
      zoomInBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        currentScale = Math.min(currentScale * 1.25, 6.0);
        applyTransform();
      });

      zoomOutBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        currentScale = Math.max(currentScale / 1.25, 0.15);
        applyTransform();
      });

      zoomResetBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        currentScale = 1.0;
        translateX = 0;
        translateY = 0;
        applyTransform();
      });

      cardToggle.addEventListener('click', (e) => {
        e.stopPropagation();
        whiteCardMode = !whiteCardMode;
        if (whiteCardMode) {
          card.classList.remove('transparent-mode');
          cardToggle.textContent = 'Card: White';
        } else {
          card.classList.add('transparent-mode');
          cardToggle.textContent = 'Card: Clear';
        }
      });

      closeBtn.addEventListener('click', closeLightbox);
      viewport.addEventListener('click', (e) => {
        if (e.target === viewport || e.target === stage) closeLightbox();
      });

      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && modal.classList.contains('active')) {
          closeLightbox();
        }
      });

      // Click Delegation for all on-page images and diagrams
      document.addEventListener('click', (e) => {
        if (e.target.closest('#ts-lightbox-modal')) return;
        if (e.target.closest('a')) return;
        if (e.target.closest('.docsify-copy-code-button')) return;

        // 1. Mermaid diagram click
        const mermaidContainer = e.target.closest('.mermaid');
        if (mermaidContainer) {
          const svg = mermaidContainer.querySelector('svg');
          if (svg) {
            const title = getContextTitle(mermaidContainer);
            openLightbox(svg, title, 'svg');
            return;
          }
        }

        // 2. Image click
        const img = e.target.closest('.markdown-section img');
        if (img) {
          const title = img.alt || img.title || getContextTitle(img);
          openLightbox(img, title, 'img');
          return;
        }

        // 3. Standalone SVG click
        const svg = e.target.closest('.markdown-section svg');
        if (svg && !svg.closest('.mermaid')) {
          const title = getContextTitle(svg);
          openLightbox(svg, title, 'svg');
          return;
        }
      });
    })();
  </script>
</body>
</html>

server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Aggressive cache-busting for html and markdown files to prevent stale caching
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        expires -1;
    }

    # Forward all subfolder sidebar requests to the root _sidebar.md
    location ~* /_sidebar\.md$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        try_files /_sidebar.md =404;
    }

    # Ensure markdown files are served fresh without stale browser caching
    location ~* \.(md)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    types {
        text/html                             html htm shtml;
        text/markdown                         md;
        text/plain                            txt py;
        application/json                      json;
        image/jpeg                            jpeg jpg;
        image/png                             png;
        image/svg+xml                         svg svgz;
        application/pdf                       pdf;
    }
}

